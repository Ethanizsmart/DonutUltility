plugins {
    id 'fabric-loom' version '1.16.3'
    id 'maven-publish'
}

version = '1.1.7'
group = 'dev.autoominous'

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}

configurations { intermediaryIdentity }
dependencies {
    intermediaryIdentity('net.fabricmc:intermediary:1.21.11:v2') { transitive = false }
}

// Preserve the original production Intermediary identifiers in editable source.
def identityJar = layout.projectDirectory.file('.gradle/identity-mappings/1.21.11.jar').asFile
def intermediaryJar = configurations.intermediaryIdentity.singleFile
def tiny = zipTree(intermediaryJar).matching { include 'mappings/mappings.tiny' }.singleFile.getText('UTF-8')
def lines = tiny.readLines()
assert lines[0] == 'tiny\t2\t0\tofficial\tintermediary'
def mapped = new StringBuilder('tiny\t2\t0\tofficial\tintermediary\tnamed\n')
lines.drop(1).each { line ->
    mapped.append(line)
    if (line.startsWith('c\t') || line.startsWith('\tm\t') || line.startsWith('\tf\t')) {
        mapped.append('\t').append(line.substring(line.lastIndexOf('\t') + 1))
    }
    mapped.append('\n')
}
identityJar.parentFile.mkdirs()
new java.util.jar.JarOutputStream(new FileOutputStream(identityJar)).withCloseable { out ->
    def entry = new java.util.jar.JarEntry('mappings/mappings.tiny')
    entry.time = 0L
    out.putNextEntry(entry)
    out.write(mapped.toString().getBytes('UTF-8'))
    out.closeEntry()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings files(identityJar)
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.3+1.21.11'
    modImplementation 'maven.modrinth:malilib:0.27.14'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

sourceSets {
    auctionChecks {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('verifyAuctionSwordRules', JavaExec) {
    dependsOn auctionChecksClasses
    classpath = sourceSets.auctionChecks.runtimeClasspath
    mainClass = 'dev.autoominous.AuctionSwordRulesChecks'
}
tasks.named('check') { dependsOn 'verifyAuctionSwordRules' }
tasks.register('verifyInventorySellRules', JavaExec) {
    dependsOn auctionChecksClasses
    classpath = sourceSets.auctionChecks.runtimeClasspath
    mainClass = 'com.seastore.auto.seaats.client.InventorySellRulesChecks'
}
tasks.named('check') { dependsOn 'verifyInventorySellRules' }
